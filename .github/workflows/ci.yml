name: Full DevOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  # ==========================================================
  # JOB 1 — BUILD AND TEST
  # ==========================================================

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java
        run: |
          java --version

      - name: Verify Maven
        run: |
          mvn --version

      - name: Build Java Application
        working-directory: java-app
        run: |
          mvn clean package -DskipTests

      - name: Run Maven Tests
        working-directory: java-app
        run: |
          mvn test


  # ==========================================================
  # JOB 2 — DOCKER BUILD
  # ==========================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Build Docker Images
        run: |
          docker compose build

      - name: Show Docker Images
        run: |
          docker images


  # ==========================================================
  # JOB 3 — TERRAFORM INFRASTRUCTURE
  # ==========================================================

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    needs:
      - build
      - docker

    # Terraform only runs after code is pushed to main.
    # Pull requests will NOT create/change AWS infrastructure.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.ec2_ip }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS CREDENTIALS
      # ------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # TERRAFORM
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: |
          terraform version

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve tfplan

      # ------------------------------------------------------
      # GET CURRENT EC2 PUBLIC IP
      # ------------------------------------------------------

      - name: Get EC2 Public IP
        id: tf_output
        working-directory: terraform
        run: |

          EC2_IP=$(terraform output -raw ec2_public_ip)

          echo "EC2 Public IP: $EC2_IP"

          echo "ec2_ip=$EC2_IP" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # JOB 4 — ANSIBLE + EC2 DEPLOYMENT
  # ==========================================================

  deploy:
    name: Ansible EC2 Deployment
    runs-on: ubuntu-latest

    needs: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # INSTALL ANSIBLE
      # ------------------------------------------------------

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible

      - name: Verify Ansible
        run: |
          ansible --version


      # ------------------------------------------------------
      # SETUP SSH KEY
      # ------------------------------------------------------

      - name: Setup SSH Key
        run: |

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem

          chmod 600 ~/.ssh/ec2-key.pem


      # ------------------------------------------------------
      # CREATE DYNAMIC ANSIBLE INVENTORY
      # ------------------------------------------------------

      - name: Create Ansible Inventory
        run: |

          cat > ansible/inventory.ini <<EOF
          [webserver]
          ${{ needs.terraform.outputs.ec2_ip }} ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ec2-key.pem
          EOF

          echo "Ansible inventory:"
          cat ansible/inventory.ini


      # ------------------------------------------------------
      # WAIT FOR EC2 SSH
      # ------------------------------------------------------

      - name: Wait for EC2 SSH
        run: |

          for i in {1..30}; do

            if ssh \
              -i ~/.ssh/ec2-key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              ec2-user@${{ needs.terraform.outputs.ec2_ip }} \
              "echo EC2 SSH is ready"; then

              echo "EC2 SSH is ready."

              exit 0

            fi

            echo "Waiting for EC2 SSH..."

            sleep 10

          done

          echo "EC2 SSH connection failed."

          exit 1


      # ------------------------------------------------------
      # TEST ANSIBLE CONNECTION
      # ------------------------------------------------------

      - name: Test Ansible Connection
        run: |

          ansible webserver \
            -i ansible/inventory.ini \
            -m ping


      # ------------------------------------------------------
      # RUN ANSIBLE DEPLOYMENT
      # ------------------------------------------------------

      - name: Run Ansible Deployment
        run: |

          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml


      # ======================================================
      # APPLICATION VERIFICATION
      # ======================================================

      # ------------------------------------------------------
      # CHECK DOCKER CONTAINERS
      # ------------------------------------------------------

      - name: Check Docker Containers
        run: |

          ssh \
            -i ~/.ssh/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            ec2-user@${{ needs.terraform.outputs.ec2_ip }} \
            "docker ps"


      # ------------------------------------------------------
      # CHECK PORTFOLIO — PORT 8082
      # ------------------------------------------------------

      - name: Check Portfolio Application
        run: |

          ssh \
            -i ~/.ssh/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            ec2-user@${{ needs.terraform.outputs.ec2_ip }} \
            "curl -f http://localhost:8082"


      # ------------------------------------------------------
      # CHECK JAVA APPLICATION — PORT 8081
      # ------------------------------------------------------

      - name: Check Java Application
        run: |

          ssh \
            -i ~/.ssh/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            ec2-user@${{ needs.terraform.outputs.ec2_ip }} \
            "curl -f http://localhost:8081"


      # ------------------------------------------------------
      # CLEANUP SSH KEY
      # ------------------------------------------------------

      - name: Cleanup SSH Key
        if: always()
        run: |

          rm -f ~/.ssh/ec2-key.pem


  # ==========================================================
  # JOB 5 — DEPLOYMENT SUMMARY
  # ==========================================================

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest

    needs:
      - terraform
      - deploy

    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Deployment Successful
        if: needs.deploy.result == 'success'
        run: |

          echo "=============================================="
          echo "       DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=============================================="

          echo "Terraform: SUCCESS"
          echo "Ansible: SUCCESS"
          echo "EC2 Deployment: SUCCESS"
          echo "Portfolio: PORT 8082"
          echo "Java Application: PORT 8081"

          echo "=============================================="


      - name: Deployment Failed
        if: needs.deploy.result != 'success'
        run: |

          echo "=============================================="
          echo "          DEPLOYMENT FAILED"
          echo "=============================================="

          echo "Check the failed GitHub Actions job."

          echo "=============================================="

          exit 1
