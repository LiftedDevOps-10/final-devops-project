---
- name: Configure DevOps EC2 Server
  hosts: webserver
  become: true

  tasks:

    - name: Update packages
      dnf:
        name: "*"
        state: latest

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to Docker group
      user:
        name: ec2-user
        groups: docker
        append: true

    - name: Download Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
