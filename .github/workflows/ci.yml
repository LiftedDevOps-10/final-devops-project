name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          java --version

      - name: Verify Maven
        run: |
          mvn --version

      - name: Build Java Application
        run: |
          mvn clean package -DskipTests

      - name: Run Tests
        run: |
          mvn test

      - name: Verify Docker
        run: |
          docker --version

      - name: Build Docker Images
        run: |
          docker compose build
