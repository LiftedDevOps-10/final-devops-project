---
- name: Configure and Deploy Final DevOps Project
  hosts: webserver
  become: true

  tasks:

    - name: Update packages
      dnf:
        name: "*"
        state: latest

    - name: Install Git
      dnf:
        name: git
        state: present

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to Docker group
      user:
        name: ec2-user
        groups: docker
        append: true

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Clone or update project repository
      git:
        repo: "https://github.com/LiftedDevOps-10/final-devops-project.git"
        dest: /home/ec2-user/final-devops-project
        version: main
        force: true

    - name: Fix project ownership
      file:
        path: /home/ec2-user/final-devops-project
        owner: ec2-user
        group: ec2-user
        recurse: true

    - name: Stop existing containers
      command:
        cmd: docker-compose down
        chdir: /home/ec2-user/final-devops-project
      ignore_errors: true

    - name: Build and start applications
      command:
        cmd: docker-compose up -d --build
        chdir: /home/ec2-user/final-devops-project
