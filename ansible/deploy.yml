---
- name: Deploy Final DevOps Project
  hosts: webserver
  become: true

  tasks:

    - name: Install Git
      dnf:
        name: git
        state: present

    - name: Clone or update project repository
      git:
        repo: "https://github.com/LiftedDevOps-10/final-devops-project.git"
        dest: /home/ec2-user/final-devops-project
        version: main
        force: yes

    - name: Fix project ownership
      file:
        path: /home/ec2-user/final-devops-project
        owner: ec2-user
        group: ec2-user
        recurse: yes

    - name: Deploy applications
      command:
        cmd: docker-compose up -d --build
        chdir: /home/ec2-user/final-devops-project
